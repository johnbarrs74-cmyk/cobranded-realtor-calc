<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Co-branded mortgage calculator from your trusted realtor and Service First Property Group." />
    <meta name="theme-color" content="#0f172a" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Mortgage Calc" />
    <script>
      // Build a per-realtor PWA manifest link. Done before browser fetches anything
      // related to manifest, so install always uses the correct start_url.
      (function () {
        try {
          var seg = location.pathname.replace(/^\/+/, "").split("/")[0];
          var href = (seg && seg !== "api")
            ? "/api/manifest?slug=" + encodeURIComponent(seg)
            : "/api/manifest";
          var link = document.createElement("link");
          link.rel = "manifest";
          link.href = href;
          document.head.appendChild(link);
          // Also try to set apple-touch web app title for iOS
          if (seg && seg !== "api") {
            var nameMeta = document.querySelector('meta[name="apple-mobile-web-app-title"]');
            if (nameMeta) {
              var capitalized = seg.split("-").map(function(p){return p.charAt(0).toUpperCase()+p.slice(1);}).join(" ");
              nameMeta.setAttribute("content", capitalized);
            }
          }
        } catch (e) {}
      })();
    </script>
    <title>Co-Branded Mortgage Calculator</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", function () {
          navigator.serviceWorker.register("/sw.js").catch(function () {});
        });
      }
    </script>
  </body>
</html>
